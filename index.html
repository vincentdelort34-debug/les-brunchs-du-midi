<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Lock and Dock Delivery — Service arrêté</title>
  <meta name="description" content="Le service Lock and Dock Delivery n'est plus actif."/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#6B4226"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f5f0e6;
      --dark:  #1c1a17;
      --moka:  #6B4226;
      --moka2: #7B5035;
      --gold:  #b8965a;
      --gold2: #d4aa6e;
      --fd: 'Cormorant Garamond', serif;
      --fs: 'DM Sans', sans-serif;
    }
    html, body { min-height: 100vh; }
    body {
      font-family: var(--fs);
      color: var(--cream);
      background:
        radial-gradient(ellipse at top, rgba(184,150,90,.12) 0%, transparent 55%),
        linear-gradient(180deg, var(--moka) 0%, var(--moka2) 35%, #4a2f1c 75%, var(--dark) 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b8965a' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .card {
      max-width: 560px; width: 100%;
      text-align: center;
      position: relative; z-index: 1;
    }
    .eyebrow {
      font-size: .68rem; letter-spacing: .3em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 24px;
      display: flex; align-items: center; justify-content: center; gap: 14px;
    }
    .eyebrow::before, .eyebrow::after {
      content: ''; flex: 1; max-width: 60px; height: 1px;
      background: var(--gold); opacity: .5;
    }
    .brand {
      font-family: var(--fd); font-weight: 400;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      letter-spacing: .04em;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    .brand em { font-style: italic; color: var(--gold2); font-weight: 300; }
    .status {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(184,150,90,.15);
      border: 1px solid rgba(184,150,90,.4);
      border-radius: 999px;
      color: var(--gold);
      font-size: .74rem; font-weight: 500;
      letter-spacing: .18em; text-transform: uppercase;
      margin-bottom: 28px;
    }
    .lead {
      font-size: 1rem; line-height: 1.7;
      color: rgba(255,255,255,.8);
      max-width: 440px; margin: 0 auto 28px;
    }
    .divider {
      width: 60px; height: 1px;
      background: var(--gold); opacity: .4;
      margin: 32px auto;
    }
    .meta {
      font-size: .82rem; color: rgba(255,255,255,.5);
      line-height: 1.7;
    }
    .meta a {
      color: var(--gold); text-decoration: none;
      border-bottom: 1px solid rgba(184,150,90,.35);
      transition: border-color .2s;
    }
    .meta a:hover { border-bottom-color: var(--gold); }
    footer {
      position: fixed; bottom: 20px; left: 0; right: 0;
      text-align: center;
      font-size: .68rem; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(255,255,255,.25);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Canal du Midi</div>
    <h1 class="brand">Lock and Dock <em>Delivery</em></h1>
    <div class="status">🔒 Service arrêté</div>
    <p class="lead">
      Merci à toutes les personnes qui ont utilisé le service.
      La livraison de provisions à bord n'est plus assurée par cette adresse.
    </p>
    <div class="divider"></div>
    <div class="meta">
      Pour toute question, écrivez à<br/>
      <a href="mailto:titdlrt@icloud.com">titdlrt@icloud.com</a>
    </div>
  </main>
  <footer>© Lock and Dock Delivery</footer>
</body>
</html>
